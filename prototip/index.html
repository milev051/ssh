<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSH pristup — prototip</title>
  <style>
    :root{color-scheme:light;--ink:#111;--muted:#555;--line:#ddd;--paper:#fff;--bg:#fff;--green:#111;--green-bg:#eee;--amber:#444;--amber-bg:#eee;--red:#222;--shadow:0 16px 50px #0002}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:0 auto;padding:28px 30px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}.brand{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;letter-spacing:-.02em}.brandmark{width:34px;height:34px;border-radius:11px;background:#173c31;color:white;display:grid;place-items:center;font-size:13px;letter-spacing:-.04em}.local-tag{border:1px solid #dce4df;background:#fff;border-radius:99px;color:#4c665b;padding:7px 12px;font-size:12px;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#46a47d}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#698075;font-size:11px;font-weight:700;margin-bottom:9px}.heading h1{font-size:34px;line-height:1.1;letter-spacing:-.045em;margin:0 0 9px}.heading p{margin:0;color:var(--muted);max-width:620px}.primary{border:0;border-radius:10px;background:#194e3c;color:white;padding:11px 16px;font-weight:650;box-shadow:0 4px 12px #194e3c20}.primary:hover{background:#123d2e}.secondary{border:1px solid #d8e0dc;border-radius:9px;background:white;color:#24372e;padding:9px 12px;font-weight:600}.secondary:hover{border-color:#8da99b;background:#fbfdfc}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 25px}.pill{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;color:#52615a;font-size:13px}.pill b{color:#26352e;margin-right:4px}.notice{border:1px solid #d8e8df;background:#edf6f1;border-radius:11px;padding:13px 15px;color:#395b4c;font-size:13px;margin-bottom:22px;display:flex;gap:11px}.notice strong{color:#204b38}.notice-icon{font-weight:800;color:#2c7959}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.section-head h2{font-size:17px;letter-spacing:-.02em;margin:0}.section-head span{font-size:12px;color:#7a8982}.host-list{display:grid;gap:14px}.host-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 7px #20362b05;overflow:hidden}.host-top{display:flex;justify-content:space-between;align-items:center;padding:17px 19px 15px;border-bottom:1px solid #edf0ee}.host-title{display:flex;align-items:center;gap:12px;min-width:0}.host-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#eef3f0;color:#345f4c;font-weight:750;font-size:14px;flex:none}.host-name{font-weight:700;letter-spacing:-.015em}.host-address{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#718079;margin-top:3px}.host-actions{display:flex;gap:8px;align-items:center}.icon-button{border:1px solid transparent;background:transparent;color:#78877f;border-radius:8px;padding:7px}.icon-button:hover{background:#f2f5f3;color:#344c3e}.account-row{display:grid;grid-template-columns:minmax(190px,1fr) 170px 180px auto;gap:18px;align-items:center;padding:14px 19px;border-bottom:1px solid #edf0ee}.account-row:last-child{border-bottom:0}.account-info{display:flex;align-items:center;gap:10px}.avatar{width:28px;height:28px;border-radius:50%;background:#ecf0f4;display:grid;place-items:center;color:#516378;font-size:11px;font-weight:700}.username{font-weight:650}.subtext{font-size:12px;color:#84918b;margin-top:2px}.key-state{display:flex;align-items:center;gap:7px;color:#5b6b63;font-size:13px}.state-dot{width:7px;height:7px;background:#c0c9c4;border-radius:50%}.key-state.active{color:var(--green)}.key-state.active .state-dot{background:#3a9a72}.key-state.none{color:#8b6b37}.key-state.none .state-dot{background:#d5a34a}.expiry{font-size:12px;color:#829088}.row-actions{display:flex;justify-content:flex-end;gap:8px}.small-button{border:1px solid #dfe6e2;background:#fff;border-radius:8px;padding:8px 10px;color:#31483b;font-size:12px;font-weight:650;white-space:nowrap}.small-button:hover{border-color:#9ab4a5;background:#f8fbf9}.small-button.main{background:#edf6f1;border-color:#d1e6d9;color:#236243}.small-button.main:hover{background:#e0f0e7}.empty{background:white;border:1px dashed #cbd7d0;border-radius:12px;padding:30px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#304338;margin-bottom:5px}.footer-note{margin-top:19px;color:#89958f;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#12221bb0;display:none;place-items:center;padding:20px;z-index:5}.modal-backdrop.show{display:grid}.modal{width:min(520px,100%);background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:23px}.modal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.modal h3{font-size:20px;letter-spacing:-.03em;margin:0}.modal-copy{margin:5px 0 0;color:var(--muted);font-size:13px}.close{border:0;background:transparent;color:#718078;font-size:22px;line-height:1;padding:0 3px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;font-weight:650;color:#53635a;margin-bottom:6px}.field input{width:100%;border:1px solid #dce4df;border-radius:8px;padding:10px 11px;outline:none}.field input:focus{border-color:#5e977b;box-shadow:0 0 0 3px #4a9c761c}.field-hint{font-size:11px;color:#859189;margin-top:5px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.steps{display:grid;gap:12px;margin:18px 0}.step{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:#485a50}.step-num{width:23px;height:23px;flex:none;display:grid;place-items:center;border-radius:50%;background:#edf5f0;color:#287052;font-size:12px;font-weight:700}.fake-key{background:#f4f7f5;border:1px solid #e3e9e5;border-radius:8px;padding:10px;color:#405248;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;background:#183d30;color:white;border-radius:9px;padding:11px 16px;font-size:13px;transition:.2s;pointer-events:none;z-index:8;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.demo-badge{display:inline-flex;align-items:center;background:#fff3d9;border:1px solid #f0dfba;color:#886322;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:750;letter-spacing:.06em;margin-left:8px;vertical-align:2px}.confirm-line{background:#f1f7f3;border-radius:8px;padding:10px 12px;font-size:12px;color:#446253;margin-top:12px}.danger-copy{font-size:12px;color:#967239;margin-top:12px}
    .shell{max-width:760px;padding-top:26px}.local-tag,.summary,.notice,.section-head,.footer-note,.eyebrow,.heading p,.host-address,.subtext,.topbar{display:none!important}.host-list{gap:10px}.host-card{border-radius:8px;box-shadow:none}.host-top{padding:10px 12px}.host-title{display:block}.panel-link{display:block;margin-bottom:2px;font-size:11px;color:#444;text-decoration:underline}.account-row{grid-template-columns:minmax(130px,1fr) minmax(150px,auto) auto;gap:12px;padding:9px 12px}.key-state{font-size:12px}.row-actions{gap:6px}.small-button{padding:6px 9px;font-size:11px}.primary{background:#111;color:#fff;border-radius:6px;box-shadow:none}.primary:hover{background:#333}.secondary{background:#fff;border-color:#bbb;color:#111;border-radius:6px}.secondary:hover{background:#f3f3f3;border-color:#777}.small-button{border-color:#bbb;color:#111;background:#fff;border-radius:6px}.small-button:hover{background:#f3f3f3;border-color:#777}a.small-button{text-decoration:none}.small-button.main{background:#eee;border-color:#999;color:#111}.small-button.main:hover{background:#ddd}.key-state.active,.key-state.none{color:#111}.empty{border-color:#aaa;color:#444;border-radius:8px}.confirm-line,.fake-key{background:#f3f3f3;color:#222;border-color:#ccc}.danger-copy{color:#444}.step-num{background:#eee;color:#111}.field input:focus{border-color:#555;box-shadow:0 0 0 3px #0002}.toast{background:#111}.add-access{width:100%;margin:0 0 10px}
    @media(max-width:760px){.shell{padding:18px 13px 35px}.add-access{width:100%}.account-row{grid-template-columns:minmax(90px,1fr) auto;gap:7px;padding:10px 12px}.account-row .key-state{grid-column:1}.account-row .row-actions{grid-column:2;grid-row:1/3;flex-direction:column;align-items:stretch}.host-top{padding:10px 12px}.host-name{font-size:13px;overflow-wrap:anywhere}.small-button{padding:7px}}
  </style>
</head>
<body>
  <main class="shell">
    <button class="primary add-access" id="addHost">Dodaj server</button>
    <section class="host-list" id="hostList"></section>
  </main>
  <div class="modal-backdrop" id="backdrop" role="presentation"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
  <div class="toast" id="toast"></div>
  <script>
    const STORE='ssh-access-prototype-v1';
    let savedHosts=[],savedUsers=[];
    try{const saved=JSON.parse(localStorage.getItem(STORE)||'{}');if(Array.isArray(saved))savedHosts=saved.filter(h=>h.source==='local').map(h=>({...h,accounts:(h.accounts||[]).filter(a=>a.key&&a.key!=='none')}));else{savedHosts=(saved.hosts||[]).filter(h=>h.source==='local').map(h=>({...h,accounts:(h.accounts||[]).filter(a=>a.key&&a.key!=='none')}));savedUsers=(saved.users||[]).filter(x=>x.account?.key&&x.account.key!=='none')}}catch{}
    let data=[];
    const list=document.querySelector('#hostList'),backdrop=document.querySelector('#backdrop'),modal=document.querySelector('#modal');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){const hosts=data.filter(h=>h.source==='local').map(h=>({...h,accounts:h.accounts.filter(a=>a.key&&a.key!=='none')}));const users=data.filter(h=>h.source==='repo').flatMap(h=>h.accounts.filter(a=>a.source==='local'&&a.key&&a.key!=='none').map(a=>({host:h.host,port:h.port,account:a})));localStorage.setItem(STORE,JSON.stringify({hosts,users}));render()}
    function initials(s){return s.slice(0,2).toUpperCase()}
    function untilText(time){if(!time)return '';let n=Math.max(1,Math.ceil((time-Date.now())/3600000));return n<2?'Aktivan još manje od 2 sata':`Aktivan još oko ${n} sati`}
    function state(a){if(a.key==='active')return `<div class="key-state active">${untilText(a.until)}</div>`;if(a.key==='inactive')return `<div class="key-state">Nije aktivan</div>`;return `<div class="key-state none">Nema ključa</div>`}
    function render(){
      if(!data.length){list.innerHTML='<div class="empty"><strong>Još nema dodatih hosting naloga</strong>Dodaj host, port i korisničko ime da počneš.</div>';return}
      list.innerHTML=data.map(h=>`<article class="host-card"><div class="host-top"><div class="host-title">${/^https?:\/\//i.test(h.panelUrl||'')?`<a class="panel-link" href="${esc(h.panelUrl)}" target="_blank" rel="noopener noreferrer">${esc(panelLabel(h.panelUrl))} ↗</a>`:''}<div class="host-name">${esc(h.host)}${h.port!=='22'?`:${esc(h.port)}`:''}</div></div><div class="host-actions"><button class="small-button" data-add-account="${h.id}">Dodaj korisnika</button><button class="small-button" data-delete-host="${h.id}">Obriši server</button></div></div>${h.accounts.map(a=>`<div class="account-row"><div class="account-info"><div class="username">${esc(a.user)}</div></div>${state(a)}<div class="row-actions">${a.publicKey?`<button class="small-button" data-public-key="${h.id}|${a.id}">Kopiraj javni ključ</button>`:''}${a.key==='none'?`<button class="small-button main" data-create="${h.id}|${a.id}">Napravi ključ</button>`:a.key==='inactive'?`<button class="small-button main" data-activate="${h.id}|${a.id}">Aktiviraj</button><button class="small-button" data-create="${h.id}|${a.id}">Novi ključ</button>`:`<button class="small-button" data-create="${h.id}|${a.id}">Novi ključ</button>`}<button class="small-button" data-delete-account="${h.id}|${a.id}">Obriši korisnika</button></div></div>`).join('')||'<div class="empty">Nema korisnika.</div>'}</article>`).join('');
      list.querySelectorAll('[data-add-account]').forEach(b=>b.onclick=()=>accountForm(b.dataset.addAccount));
      list.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>createFlow(b.dataset.create));
      list.querySelectorAll('[data-activate]').forEach(b=>b.onclick=()=>activateFlow(b.dataset.activate));
      list.querySelectorAll('[data-public-key]').forEach(b=>b.onclick=()=>copyPublicKey(b.dataset.publicKey));
      list.querySelectorAll('[data-delete-account]').forEach(b=>b.onclick=()=>deleteAccountFlow(b.dataset.deleteAccount));
      list.querySelectorAll('[data-delete-host]').forEach(b=>b.onclick=()=>deleteHostFlow(b.dataset.deleteHost));
      list.querySelectorAll('[data-active-info]').forEach(b=>b.onclick=()=>toast('Ključ je aktivan za novu SSH prijavu'));
    }
    async function loadRepositoryTargets(){
      try{
        const targets=await fetch('/api/servers',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('config');return r.json()});
        const grouped=new Map();
        for(const t of targets){const key=`${t.host}|${t.port}`;let h=grouped.get(key);if(!h){h={id:`repo-${encodeURIComponent(t.host)}-${t.port}`,host:t.host,port:t.port,panelUrl:t.panel_url||'',source:'repo',accounts:[]};grouped.set(key,h)}h.accounts.push({id:`${t.id}-${t.user}`,serverId:t.id,user:t.user,key:t.key,publicKey:t.public_key||'',source:'repo'})}
        const repo=[...grouped.values()];
        for(const item of savedUsers){const h=repo.find(x=>x.host===item.host&&x.port===item.port);if(h)h.accounts.push({...item.account,source:'local'})}
        data=[...repo,...savedHosts];render();
      }catch{list.innerHTML='<div class="empty">Ne mogu da učitam serveri/*/config. Pokreni prototip preko prototip/server.py.</div>'}
    }
    function show(content){modal.innerHTML=content;modal.querySelectorAll('input[type="password"]').forEach(input=>{input.value='';input.autocomplete='off';input.readOnly=true;input.addEventListener('focus',()=>{input.readOnly=false},{once:true});if(document.activeElement===input)input.readOnly=false});backdrop.classList.add('show');modal.querySelector('[autofocus]')?.focus()}
    function close(){backdrop.classList.remove('show')}
    function panelLabel(value){try{return new URL(value).host}catch{return value}}
    async function writeClipboard(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return true}}catch{}const field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();let copied=false;try{copied=document.execCommand('copy')}catch{}field.remove();return copied}
    function manualKey(pair){const {h,a}=accountFor(pair);show(`<div class="modal-top"><div><h3 id="modalTitle">Javni ključ</h3><p class="modal-copy">${esc(a.user)} · ${esc(h.host)}</p></div><button class="close" aria-label="Zatvori">×</button></div><pre class="fake-key">${esc(a.publicKey)}</pre><div class="modal-actions"><button class="secondary cancel">Zatvori</button></div>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;toast('Ključ je označen. Kopiraj ga sa Ctrl+C ili Cmd+C.')}
    async function copyPublicKey(pair){const {a}=accountFor(pair);if(!a.publicKey){toast('Javni ključ nije pronađen');return}if(await writeClipboard(a.publicKey)){toast('Javni ključ je prekopiran')}else manualKey(pair)}
    backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    document.querySelector('#addHost').onclick=()=>hostForm();
    function hostForm(){show(`<div class="modal-top"><div><h3 id="modalTitle">Dodaj server</h3><p class="modal-copy">Podaci se čuvaju lokalno. Ništa se ne upisuje u Git.</p></div><button class="close" aria-label="Zatvori">×</button></div><form id="hostForm"><label class="field"><span>URL za prijavu u hosting panel</span><input name="panelUrl" type="url" placeholder="https://panel.example.com/" required autofocus><div class="field-hint">Unesi adresu svog hosting panela.</div></label><label class="field"><span>IP adresa SSH servera</span><input name="host" placeholder="npr. 203.0.113.10" required></label><label class="field"><span>SSH port</span><input name="port" value="22" inputmode="numeric" required></label><label class="field"><span>Korisničko ime</span><input name="user" placeholder="npr. deploy" required></label><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Sačuvaj i nastavi</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#hostForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),panelUrl=f.get('panelUrl').trim();let parsed;try{parsed=new URL(panelUrl);if(!['http:','https:'].includes(parsed.protocol))throw new Error('protocol')}catch{toast('Unesi važeći http ili https link za hosting panel');return}const host={id:crypto.randomUUID(),host:f.get('host').trim(),port:f.get('port').trim(),panelUrl:parsed.href,source:'local',accounts:[{id:crypto.randomUUID(),user:f.get('user').trim(),key:'none',source:'local'}]};data.push(host);save();close();createFlow(`${host.id}|${host.accounts[0].id}`)}}
    function accountForm(hostId){const h=data.find(x=>x.id===hostId);show(`<div class="modal-top"><div><h3 id="modalTitle">Dodaj korisnika</h3><p class="modal-copy">${esc(h.host)}${h.port!=='22'?` · port ${esc(h.port)}`:''}</p></div><button class="close" aria-label="Zatvori">×</button></div><form id="accountForm"><label class="field"><span>Korisničko ime</span><input name="user" placeholder="npr. deploy" required autofocus></label><div class="confirm-line">Napraviće se zaseban lokalni ključ za ovaj SSH nalog.</div><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Dodaj korisnika</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#accountForm').onsubmit=e=>{e.preventDefault();const user=new FormData(e.target).get('user').trim();h.accounts.push({id:crypto.randomUUID(),user,key:'none',source:'local'});save();close();toast('Korisnik je dodat');}}
    function accountFor(pair){const [hid,aid]=pair.split('|');const h=data.find(x=>x.id===hid);return {h,a:h.accounts.find(x=>x.id===aid)}}
    function actionTarget(h,a){return {source:a.source==='repo'?'repo':'local',target_id:a.serverId||'',host:h.host,port:h.port,user:a.user}}
    async function sendKeyAction(action,target){const response=await fetch(`/api/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(target)});const result=await response.json();if(!response.ok)throw new Error(result.error||'SSH radnja nije uspela');return result}
    function createFlow(pair){const {h,a}=accountFor(pair);show(`<div class="modal-top"><div><h3 id="modalTitle">Novi SSH ključ</h3><p class="modal-copy">${esc(h.host)} · ${esc(a.user)}</p></div><button class="close" aria-label="Zatvori">×</button></div><form id="keyForm" autocomplete="off"><label class="field"><span>Passphrase ključa</span><input name="passphrase" type="password" minlength="8" maxlength="256" autocomplete="new-password" required autofocus><div class="field-hint">Najmanje 8 znakova. Čuva se samo na ovom računaru, uz privatni ključ.</div></label><label class="field"><span>Ponovi passphrase</span><input name="confirm" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></label><div class="confirm-line">Stari ključ se čuva kao lokalna rezervna kopija. Novi javni ključ će se prikazati nakon izrade.</div><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Napravi ključ</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#keyForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,passphrase=form.elements.passphrase.value;if(passphrase!==form.elements.confirm.value){toast('Passphrase se ne podudara');return}const button=form.querySelector('.primary');button.disabled=true;button.textContent='Pravim ključ…';try{const result=await sendKeyAction('create-key',{...actionTarget(h,a),passphrase});form.elements.passphrase.value='';form.elements.confirm.value='';a.key='inactive';delete a.until;a.publicKey=result.public_key;save();show(`<div class="modal-top"><div><h3 id="modalTitle">Ključ je napravljen</h3><p class="modal-copy">Kopiraj javni ključ i dodaj ga u hosting panel.</p></div><button class="close" aria-label="Zatvori">×</button></div><pre class="fake-key">${esc(a.publicKey)}</pre><div class="modal-actions"><button class="secondary cancel">Zatvori</button><button class="primary copy-created">Kopiraj javni ključ</button></div>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('.copy-created').onclick=async()=>{if(await writeClipboard(a.publicKey))toast('Javni ključ je prekopiran');else manualKey(pair)}}catch(error){form.elements.passphrase.value='';form.elements.confirm.value='';button.disabled=false;button.textContent='Pokušaj ponovo';toast(error.message)}}}
    function activateFlow(pair){const {h,a}=accountFor(pair);show(`<div class="modal-top"><div><h3 id="modalTitle">Aktiviraj ključ</h3><p class="modal-copy">${esc(a.user)} · ${esc(h.host)}</p></div><button class="close" aria-label="Zatvori">×</button></div><form id="activateForm"><label class="field"><span>Passphrase ključa</span><input name="passphrase" type="password" autocomplete="current-password" required autofocus></label><p class="modal-copy">ssh-agent će zadržati ključ do 12 sati.</p><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Aktiviraj</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#activateForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,passphrase=form.elements.passphrase.value,button=form.querySelector('.primary');button.disabled=true;button.textContent='Aktiviram…';try{await sendKeyAction('activate-key',{...actionTarget(h,a),passphrase});form.elements.passphrase.value='';if(h.source==='local'){a.key='active';a.until=Date.now()+12*3600000;save()}else await loadRepositoryTargets();close();toast('Ključ je aktivan narednih 12 sati')}catch(error){form.elements.passphrase.value='';button.disabled=false;button.textContent='Pokušaj ponovo';toast(error.message)}}}
    function deleteAccountFlow(pair){const {h,a}=accountFor(pair);show(`<div class="modal-top"><div><h3 id="modalTitle">Obriši SSH korisnika</h3><p class="modal-copy">${esc(a.user)} · ${esc(h.host)}</p></div><button class="close" aria-label="Zatvori">×</button></div><p class="modal-copy">Ovo uklanja korisnika iz programa i briše njegov lokalni ključ i rezervne kopije. Ako je ključ već dodat u hosting panel, ukloni ga i tamo.</p><form id="deleteAccountForm"><label class="field"><span>Unesi korisničko ime za potvrdu: ${esc(a.user)}</span><input name="confirm" autocomplete="off" required autofocus></label><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Obriši korisnika</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#deleteAccountForm').onsubmit=async e=>{e.preventDefault();if(e.currentTarget.elements.confirm.value!==a.user){toast('Korisničko ime se ne podudara');return}const button=e.currentTarget.querySelector('.primary');button.disabled=true;try{await sendKeyAction('delete-account',actionTarget(h,a));h.accounts=h.accounts.filter(x=>x!==a);if(h.source==='repo'&&!h.accounts.length)data=data.filter(x=>x!==h);save();close();toast('Korisnik i lokalni ključ su obrisani')}catch(error){button.disabled=false;toast(error.message)}}}
    function deleteHostFlow(hostId){const h=data.find(x=>x.id===hostId);show(`<div class="modal-top"><div><h3 id="modalTitle">Obriši server</h3><p class="modal-copy">${esc(h.host)}${h.port!=='22'?` · port ${esc(h.port)}`:''}</p></div><button class="close" aria-label="Zatvori">×</button></div><p class="modal-copy">Brišu se server, njegovi SSH nalozi i lokalni ključevi sa rezervnim kopijama. Hosting panel može i dalje da ima odobrene javne ključeve; njih ukloni u panelu.</p><form id="deleteHostForm"><label class="field"><span>Unesi adresu servera za potvrdu: ${esc(h.host)}</span><input name="confirm" autocomplete="off" required autofocus></label><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Obriši server</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#deleteHostForm').onsubmit=async e=>{e.preventDefault();if(e.currentTarget.elements.confirm.value!==h.host){toast('Adresa servera se ne podudara');return}const button=e.currentTarget.querySelector('.primary');button.disabled=true;try{const target={source:h.source,host:h.host,port:h.port,users:h.accounts.filter(a=>a.source==='local').map(a=>a.user),local_users:h.accounts.filter(a=>a.source==='local').map(a=>a.user),target_ids:h.accounts.map(a=>a.serverId).filter(Boolean)};await sendKeyAction('delete-server',target);data=data.filter(x=>x!==h);if(h.source==='local')savedHosts=savedHosts.filter(x=>x.id!==h.id);save();close();toast('Server i lokalni ključevi su obrisani')}catch(error){button.disabled=false;toast(error.message)}}}
    function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
    loadRepositoryTargets();
  </script>
</body>
</html>
