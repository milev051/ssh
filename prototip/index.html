<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSH pristup — prototip</title>
  <style>
    :root{color-scheme:light;--ink:#111;--muted:#555;--line:#ddd;--paper:#fff;--bg:#fff;--green:#111;--green-bg:#eee;--amber:#444;--amber-bg:#eee;--red:#222;--shadow:0 16px 50px #0002}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:0 auto;padding:26px 30px 56px}.primary{border:0;border-radius:6px;background:#111;color:white;padding:9px 15px;font-weight:650}.primary:hover{background:#333}.secondary{border:1px solid #bbb;border-radius:6px;background:white;color:#111;padding:9px 13px;font-weight:600}.secondary:hover{background:#f3f3f3;border-color:#777}    .danger{border:1px solid #d8b4b4;border-radius:6px;background:#fff;color:#9b2424;padding:8px 12px;font-size:12px;font-weight:600}.danger:hover{background:#fdf4f4;border-color:#bb6868}.key-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.key-info{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}.key-title{font-size:14px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}.key-subtext{font-size:12px;color:#555;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.key-actions{display:flex;gap:7px;align-items:center;flex-shrink:0}.host-list{display:grid;gap:10px}.host-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;border-left:4px solid transparent}.host-card.active{background:#f6fbf7;border-color:#b8dfbf;border-left:4px solid #1a7f37}.host-card.active .host-top,.host-card.active .account-row{border-bottom-color:#e1eee3}.host-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #edf0ee}.host-title{display:block}.host-name{font-weight:700;letter-spacing:-.015em;font-size:14px}.host-link{color:inherit;text-decoration:underline;text-decoration-color:#bbb;text-underline-offset:3px}.host-link:hover{text-decoration-color:#111;color:#000}.host-actions{display:flex;gap:8px;align-items:center}.account-row{display:grid;grid-template-columns:minmax(130px,1fr) minmax(130px,auto) auto;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid #edf0ee}.account-row:last-child{border-bottom:0}.account-info{display:flex;align-items:center;gap:10px}.username{font-weight:650}.key-state{display:flex;align-items:center;gap:7px;color:#5b6b63;font-size:12px}.key-state.active{color:#176b32;background:#e9f5eb;border:1px solid #b8dfbf;border-radius:6px;padding:3px 8px}.key-state.none{color:#8b6b37}.row-actions{display:flex;justify-content:flex-end;gap:6px}.small-button{border:1px solid #bbb;background:#fff;border-radius:6px;padding:6px 9px;color:#111;font-size:11px;font-weight:650;white-space:nowrap}.small-button:hover{border-color:#777;background:#f3f3f3}.small-button.main{background:#eee;border-color:#999;color:#111}.small-button.main:hover{background:#ddd}.empty{background:white;border:1px dashed #aaa;border-radius:8px;padding:26px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#304338;margin-bottom:5px}.modal-backdrop{position:fixed;inset:0;background:#12221bb0;display:none;place-items:center;padding:20px;z-index:5}.modal-backdrop.show{display:grid}.modal{width:min(520px,100%);background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:23px}.modal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.modal h3{font-size:20px;letter-spacing:-.03em;margin:0}.modal-copy{margin:5px 0 0;color:var(--muted);font-size:13px}.close{border:0;background:transparent;color:#718078;font-size:22px;line-height:1;padding:0 3px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;font-weight:650;color:#53635a;margin-bottom:6px}.field input{width:100%;border:1px solid #dce4df;border-radius:8px;padding:10px 11px;outline:none}.field input:focus{border-color:#555;box-shadow:0 0 0 3px #0002}.field-hint{font-size:11px;color:#859189;margin-top:5px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.fake-key{background:#f3f3f3;border:1px solid #ccc;border-radius:8px;padding:10px;color:#222;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;background:#111;color:white;border-radius:9px;padding:11px 16px;font-size:13px;transition:.2s;pointer-events:none;z-index:8;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.confirm-line{background:#f3f3f3;border-radius:8px;padding:10px 12px;font-size:12px;color:#222;margin-top:12px}.add-access{width:100%;margin:0 0 10px}
    @media(max-width:760px){.shell{padding:18px 13px 35px}.key-card{flex-wrap:wrap;gap:8px;padding:9px 12px}.key-actions{width:100%;justify-content:flex-start}.add-access{width:100%}.account-row{grid-template-columns:minmax(90px,1fr) auto;gap:7px;padding:10px 12px}.account-row .key-state{grid-column:1}.account-row .row-actions{grid-column:2;grid-row:1/3;flex-direction:column;align-items:stretch}.host-top{padding:10px 12px;flex-wrap:wrap;gap:8px}.host-title{width:100%}.host-actions{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.host-actions .small-button{white-space:normal}.host-name{font-size:13px;overflow-wrap:anywhere}.small-button{padding:7px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="key-card" id="keyCard"></section>
    <button class="primary add-access" id="addHost">Dodaj server</button>
    <section class="host-list" id="hostList"></section>
  </main>
  <div class="modal-backdrop" id="backdrop" role="presentation"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
  <div class="toast" id="toast"></div>
  <script>
    const STORE='ssh-access-prototype-v1';
    let savedHosts=[],savedUsers=[];
    let savedPanelUrls={};
    let data=[];
    let computerKey=null;
    const list=document.querySelector('#hostList'),backdrop=document.querySelector('#backdrop'),modal=document.querySelector('#modal');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tabId=crypto.randomUUID();
    function tabHeartbeat(){fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:tabId}),keepalive:true}).catch(()=>{})}
    tabHeartbeat();setInterval(tabHeartbeat,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tabHeartbeat()});
    window.addEventListener('pageshow',tabHeartbeat);
    window.addEventListener('pagehide',()=>{const body=JSON.stringify({client_id:tabId});if(!navigator.sendBeacon('/api/tab-closed',new Blob([body],{type:'application/json'})))fetch('/api/tab-closed',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(()=>{})});
    let saveQueue=Promise.resolve();
    async function save(){
      const hosts=data.filter(h=>h.source==='local');
      const users=data.filter(h=>h.source==='repo').flatMap(h=>h.accounts.filter(a=>a.source==='local').map(a=>({host:h.host,port:h.port,account:a})));
      const snapshot=JSON.parse(JSON.stringify({hosts,users,panelUrls:savedPanelUrls}));
      const operation=saveQueue.then(()=>sendKeyAction('save-state',snapshot));
      saveQueue=operation.catch(()=>{});
      try{await operation;savedHosts=snapshot.hosts;savedUsers=snapshot.users;render();return true}
      catch(error){toast('Podaci nisu sačuvani: '+error.message);return false}
    }
    async function loadSavedState(){
      const response=await fetch('/api/state',{cache:'no-store'});
      const state=await response.json();
      if(!response.ok)throw new Error(state.error||'Ne mogu da učitam lokalne podatke');
      if(state){savedHosts=state.hosts||[];savedUsers=state.users||[];savedPanelUrls=state.panelUrls||{};computerKey=state.key||null;renderKeyCard();return}
      let legacy;
      try{legacy=JSON.parse(localStorage.getItem(STORE)||'null')}catch{}
      if(legacy){const migrated=Array.isArray(legacy)?{hosts:legacy.filter(h=>h.source==='local'),users:[],panelUrls:{}}:legacy;await sendKeyAction('save-state',migrated);return loadSavedState()}
    }
    function serverAddress(h){return `${h.host.includes(':')?`[${h.host}]`:h.host}:${h.port||'22'}`}
    function serverUrl(h){if(h.panelUrl)return h.panelUrl;const raw=(h.host||'').trim();if(/^https?:\/\//i.test(raw))return raw;const hostPart=raw.includes(':')?`[${raw}]`:raw;if(h.port&&h.port!=='22')return `http://${hostPart}:${h.port}`;return `http://${hostPart}`}
    function serverCommand(h,a){const p=(h.port&&h.port!=='22')?`-p ${h.port} `:'';return `ssh ${p}${a.user}@${h.host}`}
    function renderKeyCard(){
      const card=document.querySelector('#keyCard');
      if(!card)return;
      if(!computerKey||!computerKey.exists){
        card.innerHTML=`<div class="key-info"><span class="key-title">SSH ključ ovog računara</span><span class="key-subtext">Ključ još nije kreiran na ovom računaru.</span></div><div class="key-actions"><button class="small-button main" id="createKeyBtn">Kreiraj SSH ključ</button></div>`;
        card.querySelector('#createKeyBtn').onclick=()=>createComputerKeyFlow();
      }else{
        card.innerHTML=`<div class="key-info"><span class="key-title">SSH ključ ovog računara</span><span class="key-subtext">${esc(computerKey.path||computerKey.name)}</span></div><div class="key-actions"><button class="small-button main" id="copyKeyBtn">Kopiraj javni ključ</button>${!computerKey.active?'<button class="small-button" id="activateKeyBtn">Aktiviraj ključ</button>':''}<button class="danger" id="deleteKeyBtn">Obriši ključ</button></div>`;
        card.querySelector('#copyKeyBtn').onclick=()=>copyComputerPublicKey();
        if(card.querySelector('#activateKeyBtn'))card.querySelector('#activateKeyBtn').onclick=()=>activateComputerKeyFlow();
        card.querySelector('#deleteKeyBtn').onclick=()=>deleteComputerKeyFlow();
      }
    }
    function render(){
      renderKeyCard();
      if(!data.length){list.innerHTML='<div class="empty"><strong>Još nema dodatih servera</strong>Dodaj IP adresu servera da počneš. Korisnike možeš dodati kasnije.</div>';return}
      list.innerHTML=data.map(h=>`<article class="host-card${computerKey?.active?' active':''}"><div class="host-top"><div class="host-title"><div class="host-name"><a href="${esc(serverUrl(h))}" target="_blank" rel="noopener noreferrer" class="host-link">${esc(serverAddress(h))}</a></div></div><div class="host-actions"><button class="small-button" data-add-account="${esc(h.id)}">Dodaj korisnika</button><button class="small-button" data-delete-host="${esc(h.id)}">Obriši server</button></div></div>${h.accounts.map(a=>`<div class="account-row"><div class="account-info"><div class="username">${esc(a.user)}</div></div>${computerKey?.active?'<div class="key-state active">Aktivan</div>':computerKey?.exists?'<div class="key-state">Nije učitan</div>':'<div class="key-state none">Nema ključa</div>'}<div class="row-actions"><button class="small-button" data-copy-cmd="${esc(serverCommand(h,a))}">Kopiraj SSH komandu</button><button class="small-button" data-delete-account="${esc(h.id)}|${esc(a.id)}">Obriši korisnika</button></div></div>`).join('')||'<div class="empty">Nema korisnika na ovom serveru.</div>'}</article>`).join('');
      list.querySelectorAll('[data-add-account]').forEach(b=>b.onclick=()=>accountForm(b.dataset.addAccount));
      list.querySelectorAll('[data-delete-host]').forEach(b=>b.onclick=()=>deleteHostFlow(b.dataset.deleteHost));
      list.querySelectorAll('[data-delete-account]').forEach(b=>b.onclick=()=>deleteAccountFlow(b.dataset.deleteAccount));
      list.querySelectorAll('[data-copy-cmd]').forEach(b=>b.onclick=async()=>{if(await writeClipboard(b.dataset.copyCmd))toast('Kopirano: '+b.dataset.copyCmd);else toast(b.dataset.copyCmd);});
    }
    async function loadRepositoryTargets(){
      try{
        const targets=await fetch('/api/servers',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('config');return r.json()});
        const grouped=new Map();
        for(const t of targets){const key=`${t.host}|${t.port}`;let h=grouped.get(key);if(!h){h={id:`repo-${encodeURIComponent(t.host)}-${t.port}`,host:t.host,port:t.port,panelUrl:savedPanelUrls[key]??t.panel_url??'',source:'repo',accounts:[]};grouped.set(key,h)}h.accounts.push({id:`${t.id}-${t.user}`,serverId:t.id,user:t.user,key:t.key,publicKey:t.public_key||'',source:'repo'})}
        const repo=[...grouped.values()];
        for(const item of savedUsers){let h=repo.find(x=>x.host===item.host&&x.port===item.port);if(!h){h={id:`repo-${encodeURIComponent(item.host)}-${item.port}`,host:item.host,port:item.port,panelUrl:savedPanelUrls[`${item.host}|${item.port}`]||'',source:'local',accounts:[]};repo.push(h)}if(!h.accounts.some(a=>a.user===item.account.user))h.accounts.push({...item.account,source:'local'})}
        data=[...repo,...savedHosts];render();
      }catch(error){list.innerHTML=`<div class="empty">${esc(error.message||'Ne mogu da učitam servere.')}</div>`}
    }
    function show(content){modal.innerHTML=content;modal.querySelectorAll('input[type="password"]').forEach(input=>{input.value='';input.autocomplete='off';input.readOnly=true;input.addEventListener('focus',()=>{input.readOnly=false},{once:true});if(document.activeElement===input)input.readOnly=false});backdrop.classList.add('show');modal.querySelector('[autofocus]')?.focus()}
    function close(){backdrop.classList.remove('show')}
    async function writeClipboard(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return true}}catch{}const field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();let copied=false;try{copied=document.execCommand('copy')}catch{}field.remove();return copied}
    async function copyComputerPublicKey(){if(!computerKey||!computerKey.publicKey){toast('Javni ključ nije pronađen');return}if(await writeClipboard(computerKey.publicKey))toast('Javni ključ je prekopiran u clipboard');else showComputerPublicKey()}
    function showComputerPublicKey(){show(`<div class="modal-top"><div><h3 id="modalTitle">Javni SSH ključ računara</h3><p class="modal-copy">${esc(computerKey.path||computerKey.name)}</p></div><button class="close" aria-label="Zatvori">×</button></div><p class="modal-copy">Kopiraj ovaj javni ključ i ubaci ga u hosting panel ili ~/.ssh/authorized_keys na serveru.</p><pre class="fake-key">${esc(computerKey.publicKey)}</pre><div class="modal-actions"><button class="secondary cancel">Zatvori</button><button class="primary copy-created">Kopiraj javni ključ</button></div>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('.copy-created').onclick=async()=>{if(await writeClipboard(computerKey.publicKey))toast('Javni ključ je prekopiran');}}
    function createComputerKeyFlow(){show(`<div class="modal-top"><div><h3 id="modalTitle">Kreiraj SSH ključ računara</h3><p class="modal-copy">Jedinstveni ključ za sve servere sa ovog računara.</p></div><button class="close" aria-label="Zatvori">×</button></div><form id="keyForm" autocomplete="off"><label class="field"><span>Passphrase ključa (opciono)</span><input name="passphrase" type="password" maxlength="256" autocomplete="new-password" autofocus><div class="field-hint">Može ostati prazna. Bez passphrase-a, privatni ključ nije dodatno zaštićen.</div></label><label class="field"><span>Ponovi passphrase</span><input name="confirm" type="password" maxlength="256" autocomplete="new-password"></label><div class="confirm-line">Pravi se standardni ED25519 par ključeva (~/.ssh/id_ed25519).</div><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Kreiraj ključ</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#keyForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,passphrase=form.elements.passphrase.value;if(passphrase!==form.elements.confirm.value){toast('Passphrase se ne podudara');return}const button=form.querySelector('.primary');button.disabled=true;button.textContent='Pravim ključ…';try{await sendKeyAction('create-key',{passphrase});await loadSavedState();render();close();showComputerPublicKey()}catch(err){button.disabled=false;button.textContent='Pokušaj ponovo';toast(err.message)}}}
    function activateComputerKeyFlow(){show(`<div class="modal-top"><div><h3 id="modalTitle">Aktiviraj SSH ključ</h3><p class="modal-copy">${esc(computerKey.path||computerKey.name)}</p></div><button class="close" aria-label="Zatvori">×</button></div><form id="activateForm"><label class="field"><span>Passphrase ključa</span><input name="passphrase" type="password" autocomplete="current-password" autofocus></label><p class="modal-copy">Ostavi prazno ako ključ nema passphrase. Ključ ostaje učitan u ssh-agent.</p><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Aktiviraj</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#activateForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,passphrase=form.elements.passphrase.value,button=form.querySelector('.primary');button.disabled=true;button.textContent='Aktiviram…';try{await sendKeyAction('activate-key',{passphrase});await loadSavedState();render();close();toast('SSH ključ je uspešno aktiviran')}catch(err){button.disabled=false;button.textContent='Pokušaj ponovo';toast(err.message)}}}
    function deleteComputerKeyFlow(){show(`<div class="modal-top"><div><h3 id="modalTitle">Obriši SSH ključ računara</h3><p class="modal-copy">${esc(computerKey.path||computerKey.name)}</p></div><button class="close" aria-label="Zatvori">×</button></div><p class="modal-copy">Ovo uklanja privatni i javni ključ sa računara (čuva se lokalni bekap .stari). Dok ne napraviš novi ključ, nećeš imati pristup serverima.</p><form id="deleteKeyForm"><label class="field"><span>Unesi "${esc(computerKey.name)}" za potvrdu brisanja:</span><input name="confirm" autocomplete="off" required autofocus></label><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="danger">Obriši ključ</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#deleteKeyForm').onsubmit=async e=>{e.preventDefault();const val=e.currentTarget.elements.confirm.value.trim();if(val!==computerKey.name){toast('Naziv se ne podudara');return}const button=e.currentTarget.querySelector('.danger');button.disabled=true;try{await sendKeyAction('delete-key',{confirm:val});await loadSavedState();render();close();toast('SSH ključ je obrisan')}catch(err){button.disabled=false;toast(err.message)}}}
    backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    document.querySelector('#addHost').onclick=()=>hostForm();
    function validIp(value){
      if(value.includes(':')){try{return new URL(`http://[${value}]/`).hostname.startsWith('[')}catch{return false}}
      const parts=value.split('.');return parts.length===4&&parts.every(p=>/^\d{1,3}$/.test(p)&&Number(p)<=255);
    }
    function hostForm(){show(`<div class="modal-top"><div><h3 id="modalTitle">Dodaj server</h3><p class="modal-copy">Unesi IP adresu i SSH port. Korisnike dodaj kasnije.</p></div><button class="close" aria-label="Zatvori">×</button></div><form id="hostForm"><label class="field"><span>IP adresa SSH servera</span><input name="host" placeholder="npr. 203.0.113.10" required autofocus></label><label class="field"><span>SSH port</span><input name="port" type="number" value="22" min="1" max="65535"><div class="field-hint">Ako ostane prazno, koristi se 22.</div></label><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Sačuvaj server</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#hostForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),ip=f.get('host').trim(),port=f.get('port').trim()||'22';if(!validIp(ip)){toast('Unesi važeću IPv4 ili IPv6 adresu');return}if(data.some(h=>h.host===ip&&h.port===port)){toast('Server sa ovom IP adresom i portom već postoji');return}const host={id:crypto.randomUUID(),host:ip,port,source:'local',accounts:[]};const button=e.currentTarget.querySelector('.primary');button.disabled=true;data.push(host);if(!await save()){data=data.filter(h=>h!==host);button.disabled=false;return}close();toast('Server je sačuvan. Korisnike možeš dodati kasnije.')}}
    function accountForm(hostId){const h=data.find(x=>x.id===hostId);show(`<div class="modal-top"><div><h3 id="modalTitle">Dodaj korisnika</h3><p class="modal-copy">${esc(serverAddress(h))}</p></div><button class="close" aria-label="Zatvori">×</button></div><form id="accountForm"><label class="field"><span>Korisničko ime</span><input name="user" placeholder="npr. deploy" required autofocus></label><div class="confirm-line">Korisnik se čuva u evidenciji. Koristi se glavni SSH ključ računara.</div><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Dodaj korisnika</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#accountForm').onsubmit=async e=>{e.preventDefault();const user=new FormData(e.target).get('user').trim();if(!/^[A-Za-z0-9_.@+-]{1,100}$/.test(user)){toast('Unesi važeće korisničko ime');return}if(h.accounts.some(a=>a.user===user)){toast('Korisnik već postoji na ovom serveru');return}const account={id:crypto.randomUUID(),user,key:'none',source:'local'},button=e.currentTarget.querySelector('.primary');button.disabled=true;h.accounts.push(account);if(!await save()){h.accounts=h.accounts.filter(a=>a!==account);button.disabled=false;return}await loadSavedState();await loadRepositoryTargets();close();toast('Korisnik je dodat');}}
    async function sendKeyAction(action,target){const response=await fetch(`/api/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(target)});const result=await response.json();if(!response.ok)throw new Error(result.error||'SSH radnja nije uspela');return result}
    function deleteAccountFlow(pair){const [hid,aid]=pair.split('|');const h=data.find(x=>x.id===hid);if(!h)return;const a=h.accounts.find(x=>x.id===aid);if(!a)return;show(`<div class="modal-top"><div><h3 id="modalTitle">Obriši SSH korisnika</h3><p class="modal-copy">${esc(a.user)} · ${esc(h.host)}</p></div><button class="close" aria-label="Zatvori">×</button></div><p class="modal-copy">Ovo uklanja korisnika iz lokalne evidencije. Glavni SSH ključ računara se ne briše.</p><form id="deleteAccountForm"><label class="field"><span>Unesi korisničko ime za potvrdu: ${esc(a.user)}</span><input name="confirm" autocomplete="off" required autofocus></label><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Obriši korisnika</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#deleteAccountForm').onsubmit=async e=>{e.preventDefault();if(e.currentTarget.elements.confirm.value!==a.user){toast('Korisničko ime se ne podudara');return}const button=e.currentTarget.querySelector('.primary');button.disabled=true;try{await sendKeyAction('delete-account',{source:a.source,target_id:a.serverId||'',host:h.host,port:h.port,user:a.user});h.accounts=h.accounts.filter(x=>x!==a);if(!await save())return;close();toast('Korisnik je uklonjen iz evidencije')}catch(err){button.disabled=false;toast(err.message)}}}
    function deleteHostFlow(hostId){const h=data.find(x=>x.id===hostId);if(!h)return;show(`<div class="modal-top"><div><h3 id="modalTitle">Obriši server</h3><p class="modal-copy">${esc(serverAddress(h))}</p></div><button class="close" aria-label="Zatvori">×</button></div><p class="modal-copy">Server i njegovi nalozi se uklanjaju iz evidencije. Glavni SSH ključ računara se ne briše.</p><form id="deleteHostForm"><label class="field"><span>Unesi adresu servera za potvrdu: ${esc(h.host)}</span><input name="confirm" autocomplete="off" required autofocus></label><div class="modal-actions"><button type="button" class="secondary cancel">Otkaži</button><button class="primary">Obriši server</button></div></form>`);modal.querySelector('.close').onclick=close;modal.querySelector('.cancel').onclick=close;modal.querySelector('#deleteHostForm').onsubmit=async e=>{e.preventDefault();if(e.currentTarget.elements.confirm.value!==h.host){toast('Adresa servera se ne podudara');return}const button=e.currentTarget.querySelector('.primary');button.disabled=true;try{await sendKeyAction('delete-server',{source:h.source,host:h.host,port:h.port,users:h.accounts.map(a=>a.user),target_ids:h.accounts.map(a=>a.serverId).filter(Boolean)});data=data.filter(x=>x!==h);savedHosts=savedHosts.filter(x=>x.id!==h.id);if(!await save())return;close();toast('Server je obrisan iz evidencije')}catch(err){button.disabled=false;toast(err.message)}}}
    function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
    document.querySelector('#addHost').disabled=true;
    loadSavedState().then(()=>{document.querySelector('#addHost').disabled=false;return loadRepositoryTargets()}).catch(error=>{list.innerHTML=`<div class="empty">${esc(error.message)}</div>`});
  </script>
</body>
